<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QuickPaste</title>
  <meta name="description" content="Paste code or text and share it with a beautiful link.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css?v=3">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <div class="nav-left">
        <a class="brand" href="#/" aria-label="QuickPaste home">
          <img src="assets/icon.svg" alt="" width="26" height="26">
          <span>QuickPaste</span>
        </a>
      </div>
      <div class="nav-right">
        <nav class="nav-links" aria-label="Main">
          <a href="#/" data-nav="new">New</a>
          <a href="#/recent" data-nav="recent">Recent</a>
          <a href="#/mine" data-nav="mine" hidden>My Pastes</a>
          <a href="#/admin" data-nav="admin" hidden>Admin</a>
        </nav>
        <div class="account" id="account"></div>
      </div>
    </div>
    <div class="nav-progress" aria-hidden="true"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="footer">
    <p>QuickPaste · Pastes are stored on Supabase. Don’t share secrets.</p>
  </footer>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
  <script src="config.js?v=3"></script>
  <script src="assets/app.js?v=3" defer></script>
</body>
</html>
